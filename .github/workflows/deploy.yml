name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 直接上传静态文件，不需要任何编译步骤
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 请根据实际情况修改这里的 path！
          # 先去仓库里点开 web 文件夹，看看有没有 index.html。
          # 如果有，就用 ./web 。如果没有，请改成 ./ 
          path: './web' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
