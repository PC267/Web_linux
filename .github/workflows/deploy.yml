name: Deploy Web_linux to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 构建前端，并传入 Token 以自动下载 Release 中的镜像
      - name: Install and Build
        working-directory: ./web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 关键：提供 API 权限以获取镜像
        run: |
          pnpm install
          pnpm run build

      # 上传 Nitro 生成的静态产物 (.output/public)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
